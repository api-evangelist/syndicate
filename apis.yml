aid: syndicate
name: Syndicate
description: >-
  Syndicate is a web3 Transaction Cloud that abstracts blockchain transaction
  infrastructure for developers. Its REST APIs let teams broadcast transactions
  across EVM-compatible chains without managing private keys, nonces, or gas —
  with wallets and private keys secured inside HSM enclaves, guaranteed
  idempotency, managed gas, EIP-191 personal signing and EIP-712 typed-data
  signing and attestations, contract and function-signature authorization, IP
  allowlisting, and reliability-focused signed webhooks for real-time
  transaction status updates. Syndicate is backed by a16z crypto and ships an
  official Node.js SDK and a hosted MCP server for AI agents.
