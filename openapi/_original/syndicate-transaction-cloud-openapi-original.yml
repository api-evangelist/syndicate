    type_wallet:SignTypedDataRequest:
      type: object
      properties:
        signatureId:
          type: string
          format: uuid
          description: >-
            (Optional) ID of the request. Needs to be a valid UUID. If provided, it will be saved and returned as the
            signatureId of the response. If not provided, we will generate one for you and return it as the signatureId.
        signerAddress:
          type: string
          description: Address of a project wallet that will be used to sign the 'message'.
        message:
          type: object
          additionalProperties:
            description: Any type
          description: >-
            Data to be signed by the 'signerAddress'. The message's structure must be correctly defined in the 'types'
            mapping, specified by the 'primaryType'.
        domain:
          $ref: '#/components/schemas/type_wallet:EIP712Domain'
          description: >-
            Components of the [domain seperator](https://eips.ethereum.org/EIPS/eip-712#definition-of-domainseparator).
            At least one field is required.
        types:
          type: object
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/type_wallet:EIP712Types'
          description: >-
            Type definitions of the domain and data you are requesting signature of. At minimum you must define the
            domain with key 'EIP712Domain' and the type of your message with key specified by 'primaryType'. More
            information [here](https://eips.ethereum.org/EIPS/eip-712#definition-of-typed-structured-data-%F0%9D%95%8A).
        primaryType:
          type: string
          description: Specifies the name of the key in 'types' that describes the shape of the 'message'.
      required:
        - signerAddress
        - message
        - domain
        - types
        - primaryType
      title: SignTypedDataRequest
