    type_wallet:ContractLookup:
      type: object
      properties:
        value:
          type: string
        operation:
          $ref: '#/components/schemas/type_wallet:LookupOperation'
        type:
          $ref: '#/components/schemas/type_wallet:LookupType'
        contractAddress:
          type: string
          description: The contract address to send request to
        functionSignature:
          type: string
          description: The human readable signature to call on the contract
        args:
          type: object
          additionalProperties:
            description: Any type
          description: >-
            (Optional) The function arguments for the read contract call. The keys are the argument names or index from
            the provided 'functionSignature' and the values are the argument values.
        chainId:
          type: integer
          description: >-
            The chain ID for the network (e.g. 1 for Ethereum Mainnet, 137 for Polygon Mainnet, 80001 for Polygon
            Mumbai). For a complete list of chain IDs, see [ChainList](https://chainlist.org/?search=&testnets=true).
      required:
        - value
        - operation
        - type
        - contractAddress
        - functionSignature
        - chainId
      description: >-
        Specify a pure or view function on a contract at 'contractAddress' on a specific 'chainId' to read data from.
        'args' are optional, but must be passed if specified in the human readable 'functionSignature'
      title: ContractLookup
    type_wallet:Lookup:
      $ref: '#/components/schemas/type_wallet:ContractLookup'
      description: >-
        Smart contract call with operation and value to make an assertion about onchain data. Supported operations are
        equal to (eq), greater than (gt), and less than (lt). The data returned by the contract in conjunction with the
        specified 'operation' and 'value' must be valid to receive a signature.
      title: Lookup
    type_wallet:SignTypedDataWithLookupRequest:
      type: object
      properties:
        signatureId:
          type: string
          format: uuid
          description: >-
            (Optional) ID of the request. Needs to be a valid UUID. If provided, it will be saved and returned as the
            signatureId of the response. If not provided, we will generate one for you and return it as the signatureId.
        signerAddress:
          type: string
          description: Address of a project wallet that will be used to sign the 'message'.
        message:
          type: object
          additionalProperties:
            description: Any type
          description: >-
            Data to be signed by the 'signerAddress'. The message's structure must be correctly defined in the 'types'
            mapping, specified by the 'primaryType'.
        domain:
          $ref: '#/components/schemas/type_wallet:EIP712Domain'
          description: >-
            Components of the [domain seperator](https://eips.ethereum.org/EIPS/eip-712#definition-of-domainseparator).
            At least one field is required.
        types:
          type: object
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/type_wallet:EIP712Types'
          description: >-
            Type definitions of the domain and data you are requesting signature of. At minimum you must define the
            domain with key 'EIP712Domain' and the type of your message with key specified by 'primaryType'. More
            information [here](https://eips.ethereum.org/EIPS/eip-712#definition-of-typed-structured-data-%F0%9D%95%8A).
        primaryType:
          type: string
          description: Specifies the name of the key in 'types' that describes the shape of the 'message'.
        lookups:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/type_wallet:Lookup'
          description: >-
            Specify a maximum of 5 contract lookups to compare data with. All lookups must be valid to receive a
            signature by the 'signerAddress'.
      required:
        - signerAddress
        - message
        - domain
        - types
        - primaryType
        - lookups
      title: SignTypedDataWithLookupRequest
