openapi: 3.1.0
info:
  title: API
  version: 1.0.0
paths:
  /admin/project:
    post:
      operationId: create-project
      summary: Create Project
      description: Create a new project. Only available with environment wide API keys.
      tags:
        - api-key-manager > admin
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:Project'
        '400':
          description: Error response with status 400
        '403':
          description: Error response with status 403
        '404':
          description: Error response with status 404
        '500':
          description: Error response with status 500
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-key-manager/admin:CreateProjectRequest'
  /admin/project/{projectId}/updateName:
    post:
      operationId: update-project-name
      summary: Update Project Name
      description: Update a project name
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:Project'
        '400':
          description: Error response with status 400
        '401':
          description: Error response with status 401
        '500':
          description: Error response with status 500
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-key-manager/admin:UpdateProjectNameRequest'
  /admin/project/{projectId}:
    get:
      operationId: get-project
      summary: Get Project
      description: Get a specific project
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:Project'
        '401':
          description: Error response with status 401
  /admin/contract/authorizeWithFunctionSignatures:
    post:
      operationId: authorize-contract-with-function-signatures
      summary: Authorize Contract With Function Signatures
      description: Authorize a contract with function signatures
      tags:
        - api-key-manager > admin
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:Contract'
        '400':
          description: Error response with status 400
        '404':
          description: Error response with status 404
        '409':
          description: Error response with status 409
        '500':
          description: Error response with status 500
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-key-manager/admin:AuthorizeContractWithFunctionSignaturesRequest'
  /admin/contract/authorizeWithJSONABI:
    post:
      operationId: authorize-contract-with-jsonabi
      summary: Authorize Contract With JSONABI
      description: Authorize a contract and its corresponding function signatures using the JSON ABI format.
      tags:
        - api-key-manager > admin
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:Contract'
        '400':
          description: Error response with status 400
        '404':
          description: Error response with status 404
        '409':
          description: Error response with status 409
        '500':
          description: Error response with status 500
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-key-manager/admin:AuthorizeContractWithJSONABIRequest'
  /admin/project/{projectId}/contract/{chainId}/{contractAddress}/claim:
    post:
      operationId: claim-contract
      summary: Claim Contract
      description: >-
        Claim a contract. This contract must be authorized in your project first. See [Authorize Contract with Function
        Signatures](https://docs.syndicate.io/open-api/admin/authorize-with-fn-sigs) to authorize a contract in your
        project.
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chainId
          in: path
          required: true
          schema:
            type: integer
        - name: contractAddress
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:Contract'
        '400':
          description: Error response with status 400
        '404':
          description: Error response with status 404
        '500':
          description: Error response with status 500
  /admin/project/{projectId}/contract/{contractId}:
    delete:
      operationId: delete-contract
      summary: Delete Contract
      description: Delete a contract
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Error response with status 400
        '404':
          description: Error response with status 404
        '500':
          description: Error response with status 500
  /admin/project/{projectId}/functionSignature/{functionSignatureId}:
    delete:
      operationId: delete-function-signature
      summary: Delete Function Signature
      description: Delete a function signature
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: functionSignatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Error response with status 400
        '404':
          description: Error response with status 404
        '500':
          description: Error response with status 500
  /admin/allowedIP:
    post:
      operationId: create-allowed-ip-range
      summary: Create Allowed IP Range
      description: Create an IP range allowlist
      tags:
        - api-key-manager > admin
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-key-manager/admin:AllowlistIpRange'
        '400':
          description: Error response with status 400
        '401':
          description: Error response with status 401
        '404':
          description: Error response with status 404
        '500':
          description: Error response with status 500
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-key-manager/admin:CreateAllowedIPRangeRequest'
  /admin/project/{projectId}/allowedIPRanges:
    get:
      operationId: get-project-allowed-ip-ranges
      summary: Get Project Allowed IP Ranges
      description: Get allowed IP ranges by project ID
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_api-key-manager/admin:AllowlistIpRange'
        '401':
          description: Error response with status 401
  /admin/project/{projectId}/allowedIP/{IPId}:
    delete:
      operationId: delete-allowed-ip-range
      summary: Delete Allowed IP Range
      description: Delete an IP range allowlist
      tags:
        - api-key-manager > admin
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: IPId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Error response with status 400
        '404':
          description: Error response with status 404
        '500':
          description: Error response with status 500
  /wallet/project/{projectId}/personalSign:
    post:
      operationId: personal-sign
      summary: Personal Sign
      description: Sign EIP191 compliant message
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:SignatureResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_wallet:PersonalSignRequest'
  /wallet/project/{projectId}/signTypedData:
    post:
      operationId: sign-typed-data
      summary: Sign Typed Data
      description: Sign EIP712 compliant typed data
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:SignatureResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_wallet:SignTypedDataRequest'
  /wallet/project/{projectId}/signTypedDataWithLookup:
    post:
      operationId: sign-typed-data-with-lookup
      summary: Sign Typed Data With Lookup
      description: >-
        Sign EIP712 compliant typed data after asserting all lookups are valid. Lookups can be view or pure functions on
        smart contracts. Responses are compared to specified values in the request.
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:SignatureResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_wallet:SignTypedDataWithLookupRequest'
  /wallet/project/{projectId}/personalSignatures:
    get:
      operationId: get-project-personal-signatures
      summary: Get Project Personal Signatures
      description: Get EIP191 personal signatures for a project
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/type_wallet:MessageSignature'
  /wallet/project/{projectId}/personalSignature/{signatureId}:
    get:
      operationId: get-personal-signature
      summary: Get Personal Signature
      description: Get a personal signature by ID
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:MessageSignature'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
  /wallet/project/{projectId}/signatures:
    get:
      operationId: get-project-signatures
      summary: Get Project Signatures
      description: Get EIP712 typed data signatures for a project
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/type_wallet:Signature'
  /wallet/project/{projectId}/signature/{signatureId}:
    get:
      operationId: get-signature
      summary: Get Signature
      description: Get a typed data signature by ID
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:Signature'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:ErrorBody'
  /wallet/project/{projectId}/request/{transactionId}:
    get:
      operationId: get-transaction-request
      summary: Get Transaction Request
      description: Get a transaction request by id
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:TransactionResponse'
        '404':
          description: Error response with status 404
  /wallet/project/{projectId}/requests:
    get:
      operationId: get-transaction-requests-by-project
      summary: Get Transaction Requests By Project
      description: Gets a list of transaction requests for a project
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Optional search parameter will filter by function signature, contract address, or transaction id
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:TransactionRequestsByProjectResponse'
        '404':
          description: Error response with status 404
  /wallet/project/{projectId}/transactions:
    get:
      operationId: get-transactions-by-project
      summary: Get Transactions By Project
      description: Gets a list of transaction attempts for a project
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Optional search parameter will filter by transaction hash, wallet address, or transaction id
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: reverted
          in: query
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_wallet:AttemptStatus'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_wallet:TransactionsByProjectResponse'
  /transact/sendTransaction:
    post:
      operationId: send-transaction
      summary: Send Transaction
      description: Send transaction to blockchain
      tags:
        - transact
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_transact:SendTransactionResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_transact:ErrorBody'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_transact:ErrorBody'
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_transact:ErrorBody'
        '500':
          description: Error response with status 500
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_transact:SendTransactionRequest'
  /transact/call:
    post:
      operationId: call
      summary: Call View Function
      description: Read data from a view function on a smart contract
      tags:
        - call
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_call:ReadContractRequest'
  /wallet/project/{projectId}/wallets:
    get:
      operationId: get-wallets-by-project
      summary: Get Wallets By Project
      description: Gets a list of wallets for a project
      tags:
        - wallet
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: withData
          in: query
          description: Optional parameter to return this address's balance and total count of confirmed transactions
          required: false
          schema:
            type: boolean
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_wallet:WalletWithTxCountAndBalance'
        '500':
          description: Error response with status 500
servers:
  - url: https://api.syndicate.io
    description: Production
components:
  schemas:
    type_api-key-manager/admin:ProjectEnvironment:
      type: string
      enum:
        - staging
        - production
      title: ProjectEnvironment
    type_api-key-manager/admin:CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        environment:
          $ref: '#/components/schemas/type_api-key-manager/admin:ProjectEnvironment'
        chainId:
          type: integer
        organizationId:
          type: string
          format: uuid
        numWallets:
          type: integer
          description: Number of wallets to create for the project. Defaults to 1. Max is 10.
      required:
        - name
        - environment
        - chainId
        - organizationId
      title: CreateProjectRequest
    type_api-key-manager/admin:FunctionSignature:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        signature:
          type: string
        functionAbi:
          description: JSON ABI of the function signature. Null if function signature is unable to be parsed.
        hashedSignature:
          type: string
        contractId:
          type: string
          format: uuid
        payable:
          type: boolean
      required:
        - id
        - createdAt
        - signature
        - hashedSignature
        - contractId
        - payable
      title: FunctionSignature
    type_api-key-manager/admin:Contract:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        chainId:
          type: integer
        address:
          type: string
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
        functionSignatures:
          type: array
          items:
            $ref: '#/components/schemas/type_api-key-manager/admin:FunctionSignature'
        projectId:
          type: string
          format: uuid
        claimedByOrganizationId:
          type: string
          format: uuid
      required:
        - id
        - createdAt
        - chainId
        - address
        - name
        - functionSignatures
        - projectId
      title: Contract
    type_api-key-manager/admin:AllowlistIpRange:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ipRange:
          type: string
        projectId:
          type: string
          format: uuid
      required:
        - id
        - createdAt
        - ipRange
        - projectId
      title: AllowlistIpRange
    type_api-key-manager/admin:Project:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        environment:
          $ref: '#/components/schemas/type_api-key-manager/admin:ProjectEnvironment'
        organizationId:
          type: string
          format: uuid
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/type_api-key-manager/admin:Contract'
        allowlistIpRanges:
          type: array
